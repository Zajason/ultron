# Ultron base config. Per-machine overrides are merged on top, in order:
#   config.<platform>.toml  (config.macos.toml / config.linux.toml)
#   config.<hostname>.toml  (optional)
# Secrets never go here: put API keys in .env (git-ignored).

[user]
name = "Iason"

[persona]
# 0 = plain assistant in his voice, 1 = light dry wit, 2 = default, 3 = full theatrical villain
menace_level = 2

[llm]
fast_model = "claude-haiku-5-5"
strong_model = "claude-sonnet-5-5"      # used from Milestone 6 (escalation)
max_tokens = 1024                       # spoken replies are 1-3 sentences; this is a runaway guard
# Thinking adds time-to-first-token. "disabled" is fastest; "adaptive" lets the model think when it wants.
thinking = "disabled"
effort = "low"
cache_ttl = "1h"                        # system prompt + tools; outlives idle gaps between voice turns
max_turns = 12                          # rolling window of user turns kept verbatim
max_tool_rounds = 5
# The SDK's HTTP pool closes idle connections after 5 s by default, so the next turn pays a new
# TLS handshake (several round trips to the US from Europe). Keep connections longer, and ping
# a free endpoint so the server doesn't close them either.
keepalive_expiry_s = 300
keepwarm_interval_s = 20                # 0 disables

[tools]
max_auto_tier = 1                       # tiers above this need spoken/typed confirmation
tier3_enabled = false
timeout_s = 10
max_output_chars = 2000
notes_file = "~/.ultron/notes.md"
audit_log = "~/.ultron/audit.jsonl"

[tools.tier_overrides]
# open_app = 2

[metrics]
turns_log = "~/.ultron/turns.jsonl"

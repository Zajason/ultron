# Ultron base config. Per-machine overrides are merged on top, in order:
#   config.<platform>.toml  (config.macos.toml / config.linux.toml)
#   config.<hostname>.toml  (optional)
# Secrets never go here: put API keys in .env (git-ignored).

[user]
name = "Iason"
location = "Athens"                     # home city for weather (a guess: the API edge serving you is in Athens)

[persona]
# 0 = plain assistant in his voice, 1 = light dry wit, 2 = default, 3 = full theatrical villain
menace_level = 2

[llm]
# "hybrid": practical requests -> fast model (~0.7 s to first word), conversation -> strong model
# (~1.2 s, much better writing). "fast" / "strong" force one model for every turn.
routing = "hybrid"
fast_model = "claude-haiku-5-5"
strong_model = "claude-sonnet-5-5"
max_tokens = 1024                       # spoken replies are 1-3 sentences; this is a runaway guard
# Thinking adds time-to-first-token. "disabled" is fastest; "adaptive" lets the model think when it wants.
thinking = "disabled"
effort = "low"
cache_ttl = "1h"                        # system prompt + tools; outlives idle gaps between voice turns
max_turns = 12                          # rolling window of user turns kept verbatim
max_tool_rounds = 5
# The SDK closes idle pooled connections after 5 s. Measured from Athens, a fresh TLS connection
# costs ~17 ms (Cloudflare edge in Athens), so this is a small win, not a big one.
keepalive_expiry_s = 300
# Practical turns on a local model (MLX, Apple Silicon) instead of fast_model: first token ~75 ms
# vs ~600-800 ms for Haiku from Athens. It escalates anything beyond simple requests to
# strong_model. "" turns it off. Costs ~3 GB of RAM and ~5 s at startup.
local_model = "mlx-community/Qwen3.5-4B-MLX-4bit"
local_max_tokens = 300

[tts]
enabled = true                          # `ultron text --mute` turns voice off for one session
provider = "cartesia"
model = "sonic-3.6-2026-08-27"          # dated snapshot: the voice won't drift under us
voice_id = "ed82c17b-4704-4d34-be43-5d19065acdf1"   # Carl, "menace" preset; compare others with `ultron audition`
sample_rate = 24000                     # measured: 83 ms p50 first audio vs 103 ms at 44.1 kHz
speed = 0.85                            # 0.6-1.5; slow and controlled
emotion = "mysterious"                  # Cartesia emotion; "" lets it infer from the text
ellipsis_ms = 400                       # pause for the persona's "…"
pitch_semitones = -1.5                  # varispeed playback: lower = deeper and heavier, zero latency

[stt]
provider = "deepgram"
model = "flux-general-en"               # conversational STT with built-in turn detection
region = "eu"                           # Frankfurt: ~49 ms RTT from Athens vs ~121 ms to the US endpoint
sample_rate = 16000
frame_ms = 80                           # Deepgram's recommended frame size
eot_threshold = 0.7                     # Milestone 4: end-of-turn confidence
ptt_eot_threshold = 1.0                 # push-to-talk: only the release ends a turn (0.7 cut "humans" to "human")
eager_eot_threshold = 0.5               # >0: start replies on EagerEndOfTurn (held + rolled back if you keep talking)
eot_timeout_ms = 5000
keyterms = ["Ultron", "Iason"]

[audio]
input_device = ""                       # "" = system default
output_device = ""                      # "" = system default
output_rate = 0                         # 0 = device's native rate (48k speakers, 44.1k XM5): no CoreAudio resampling
avoid_bluetooth_mic = true              # a Bluetooth mic forces headset mode; use the built-in mic instead
aec = "auto"                            # echo cancellation: auto = on unless output is Bluetooth headphones; on; off
latency_ms = 10                         # buffer hint; reported output latency ~38 ms on built-in speakers

[wake]                                  # `ultron live --wake`
threshold = 0.8                         # detector score; held-out eval: 93.6% recall, 0.47 false wakes/hour (also verified by transcript)
patience = 1                            # consecutive 80 ms frames above threshold
idle_sleep_s = 10                       # back to sleep after this much silence
chime = true                            # short tone when he wakes

[vad]                                   # Silero, for barge-in
threshold = 0.5
start_ms = 64                           # voiced audio needed before Ultron stops talking
stop_ms = 320

[fx]
enabled = true
compress = true                         # close-mic density
warmth_db = 5.0                         # low-shelf boost
warmth_hz = 160.0
rasp = 0.08                             # parallel saturation on the upper mids
reverb_wet = 0.03                       # nearly dry: menace is close, not echoey
metal_mix = 0.08                        # ring-mod + chorus layer, mixed under the dry voice
metal_hz = 60.0                         # ring-mod carrier
sub_mix = 0.12                          # octave-down machine double
gain = 1.0

[tools]
# Tiers: 0 read and 1 low-risk run on their own; 2 (shell, write/move files) asks out loud first;
# 3 (delete -> Trash) needs the passphrase below and is off until tier3_enabled = true.
passphrase = ""                         # tier 3: say this to confirm; empty = never
confirm_timeout_s = 20
shell_timeout_s = 20
shell_allow = []                        # e.g. ["ls", "git", "du"]; empty = any program (blocked patterns still apply)
handoff_app = "claude"                  # big jobs: prompt goes to the clipboard, this app comes to the front
web_search = true                       # Anthropic-hosted web search (billed per search)
web_search_max_uses = 2
max_auto_tier = 1                       # tiers above this need spoken/typed confirmation
tier3_enabled = false
timeout_s = 10
max_output_chars = 2000
notes_file = "~/.ultron/notes.md"
memory_file = "~/.ultron/memory.md"     # durable facts (remember/forget tools); plain markdown, edit freely
audit_log = "~/.ultron/audit.jsonl"

[tools.tier_overrides]
# open_app = 2

# MCP servers: their tools become Ultron's, behind the same tiers and audit log. Tier per tool:
# `tiers` entry, else the server's hints (read-only -> 0, destructive -> 3), else `tier` (default 2: ask).
# [[mcp.servers]]
# name = "files"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "~/Documents"]
# tier = 2
# tiers = { read_text_file = 0, list_directory = 0 }
#
# [[mcp.servers]]
# name = "remote"
# url = "https://example.com/mcp"

[metrics]
turns_log = "~/.ultron/turns.jsonl"

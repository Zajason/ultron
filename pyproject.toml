[project]
name = "ultron"
version = "0.1.0"
description = "Real-time, voice-first personal assistant"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.3.0",
    "psutil==7.2.2",
    "python-dotenv==1.2.4",
]

[project.scripts]
ultron = "ultron.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project]
name = "ultron"
version = "0.1.0"
description = "Real-time, voice-first personal assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.3.0",
    "cartesia[websockets]==4.2.0",
    "deepgram-sdk==7.16.0",
    "httpx==0.28.1",
    "livekit==1.2.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "pedalboard==0.9.26",
    "psutil==7.2.2",
    "python-dotenv==1.2.4",
    "sounddevice==0.5.6",
]

[project.scripts]
ultron = "ultron.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.1",
]
train = [
    "onnx==1.23.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
